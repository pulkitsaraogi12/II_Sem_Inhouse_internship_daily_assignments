<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner JavaScript Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🚀 JavaScript Mini Project</h1>

    <p>Learn Click Counter & Dark Mode</p>

    <div class="card">

        <h2>Click Counter</h2>

        <h1 id="count">0</h1>

        <button id="increase">
            ➕ Click Me
        </button>

        <button id="decrease">
            ➖ Decrease
        </button>
        
        <button id="reset">
            🔄 Reset
        </button>

    </div>

    <button id="darkBtn">
        🌙 Dark Mode
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
