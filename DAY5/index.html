<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>July 10th Event | Register Now</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="header">
        <div class="logo">10<span>JULY</span></div>
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </header>

    <main class="container">
        <section class="hero-section">
            <div class="badge">Limited Seats Available</div>
            <h1 class="title">The Biggest Event of the Summer</h1>
            <h2 class="date">July 10th</h2>
            <p class="subtitle">Join us for an unforgettable experience filled with innovation, networking, and creative insights. Secure your spot before it's too late.</p>
            <div class="countdown" id="countdown">
                <div class="time-box">
                    <span id="days">00</span>
                    <label>Days</label>
                </div>
                <div class="time-box">
                    <span id="hours">00</span>
                    <label>Hours</label>
                </div>
                <div class="time-box">
                    <span id="minutes">00</span>
                    <label>Minutes</label>
                </div>
                <div class="time-box">
                    <span id="seconds">00</span>
                    <label>Seconds</label>
                </div>
            </div>
        </section>

        <section class="registration-section">
            <div class="glass-card">
                <h3>Register Now</h3>
                <form id="registration-form">
                    <div class="input-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="John Doe" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="ticketType">Ticket Type</label>
                        <select id="ticketType" required>
                            <option value="" disabled selected>Select a ticket</option>
                            <option value="standard">Standard Pass - $49</option>
                            <option value="vip">VIP Pass - $149</option>
                            <option value="student">Student Pass - $29</option>
                        </select>
                    </div>
                    <button type="submit" class="submit-btn">Secure My Spot</button>
                    <p class="success-msg" id="success-message">🎉 Registration successful! See you on July 10th.</p>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
